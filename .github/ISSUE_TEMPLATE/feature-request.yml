name: Feature suggestion / 功能建议
description: Suggest a feature or tell us what could work better / 想加什么功能，或哪里不好用
title: '[Feature] '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe what you would like to change. Any language is welcome.
        说说你想改进什么，用你熟悉的语言填写就好。

        [Feature list / 功能清单](https://github.com/LZSMIAO/2fa-hot/blob/main/docs/WAITLIST.md) · [Existing suggestions / 已有建议](https://github.com/LZSMIAO/2fa-hot/issues?q=is%3Aissue%20label%3Aenhancement)

        Posts are public. Do not include real secrets, passwords, account QR codes or backups.
        内容公开，请勿附上真实密钥、密码、账号二维码或备份文件。
        For security issues, use a [private report / 私密报告](https://github.com/LZSMIAO/2fa-hot/security/advisories/new).
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to change? / 想加什么功能或改进？
      description: Tell us what you want to do and what is missing. / 说说你想做什么，现在还缺什么。
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happens now? / 现在遇到了什么问题？
      description: Optional. A simple example helps. / 选填，举个例子就好。
  - type: textarea
    id: details
    attributes:
      label: Anything else? / 补充说明
      description: Optional. Remove private information from screenshots. / 选填，截图请遮住私人信息。
